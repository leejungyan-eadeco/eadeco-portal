# The portal and its Postgres. On the server: a .env next to this file (see .env.example), then
#   docker compose up -d --build
# Locally, `pnpm db:up` starts only the database and `pnpm dev` runs the portal.
services:
  db:
    image: postgres:16
    container_name: ed-eadepro-db
    restart: unless-stopped # comes back after Docker or the server restarts
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eadepro}
      POSTGRES_DB: eadepro_portal
    ports:
      - "23021:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: # the portal waits for this, so its migrations don't run before Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -U postgres -d eadepro_portal"]
      interval: 3s
      timeout: 3s
      retries: 20

  portal:
    build: .
    container_name: ed-eadepro-portal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # EADECO's DNS servers, asked directly: on Linux hosts using systemd-resolved, Docker's default DNS goes through
    # the host resolver, which refuses *.eadeco.local (".local" is treated as local-network multicast names).
    # They also resolve outside names (the parking portal, GitHub).
    dns:
      - 192.168.41.182
      - 10.30.10.209
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-eadepro}@db:5432/eadepro_portal
      NODE_ENV: production
    ports:
      - "23020:23020"
    volumes:
      - storage:/app/storage # report files and screenshots: back this volume up
volumes:
  pgdata:
  storage:
